<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowForge | Оркестратор workflow</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a2d; --line:#263455; --text:#eaf0ff; --muted:#91a0c0; --accent:#6ee7b7; --danger:#fb7185; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at top right,#20325b 0,#0b1020 42%); color:var(--text); font:15px/1.5 Inter,system-ui,sans-serif; }
    main { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:42px 0; } header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:28px; }
    h1 { margin:0; font-size:42px; letter-spacing:-1px; } h2 { margin:0 0 16px; font-size:20px; } p { color:var(--muted); }
    .tag { color:var(--accent); letter-spacing:.14em; text-transform:uppercase; font-size:12px; } .grid { display:grid; grid-template-columns:360px 1fr; gap:18px; }
    .panel { background:rgba(18,26,45,.9); border:1px solid var(--line); border-radius:12px; padding:22px; box-shadow:0 18px 50px #0003; }
    label { display:block; color:var(--muted); font-size:13px; margin:14px 0 6px; } input,textarea,select { width:100%; border:1px solid var(--line); border-radius:7px; background:#0d1528; color:var(--text); padding:10px; font:inherit; } textarea { min-height:145px; resize:vertical; }
    button { border:0; border-radius:7px; padding:10px 14px; color:#061318; background:var(--accent); font-weight:700; cursor:pointer; margin-top:16px; } button:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .row { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); } .row:last-child { border-bottom:0; } .name { font-weight:700; } small { color:var(--muted); display:block; }
    .status { border-radius:999px; padding:4px 9px; font-size:11px; letter-spacing:.04em; } .RUNNING { color:#fcd34d; background:#fcd34d22; } .COMPLETED { color:var(--accent); background:#6ee7b722; } .FAILED { color:var(--danger); background:#fb718522; } .PENDING { color:#b4c1dd; background:#b4c1dd22; }
    .empty { color:var(--muted); padding:26px 0; text-align:center; } code { color:var(--accent); }
    @media (max-width:800px) { header { display:block; } .grid { grid-template-columns:1fr; } h1 { font-size:34px; } }
  </style>
</head>
<body><main>
  <header><div><div class="tag">Платформа управления workflow</div><h1>FlowForge</h1><p>Создавайте, запускайте и отслеживайте многошаговые процессы.</p></div><div><span class="tag">API работает</span></div></header>
  <section class="grid">
    <form class="panel" id="workflow-form"><h2>Создать workflow</h2><label>Название</label><input id="name" required value="Обработка заказа"><label>Описание</label><input id="description" value="Резервирование, оплата и уведомление"><label>Шаги (JSON)</label><textarea id="steps">[
  {"name":"Резервирование товара","kind":"delay","seconds":0.5},
  {"name":"Авторизация платежа","kind":"delay","seconds":0.8},
  {"name":"Отправка уведомления","kind":"log","message":"Заказ обработан"}
]</textarea><button>Создать workflow</button><p id="form-message"></p></form>
    <div class="panel"><h2>Workflow</h2><div id="workflows" class="empty">Загрузка...</div></div>
  </section>
  <section class="panel" style="margin-top:18px"><h2>Последние запуски</h2><div id="runs" class="empty">Загрузка...</div></section>
</main><script>
const $ = id => document.getElementById(id);
async function api(path, options) { const response = await fetch(path, options); if (!response.ok) throw new Error(await response.text()); return response.json(); }
async function refresh() {
  const [workflows, runs] = await Promise.all([api('/api/workflows'), api('/api/runs')]);
  $('workflows').innerHTML = workflows.length ? workflows.map(w => `<div class="row"><div><div class="name">${escapeHtml(w.name)}</div><small>${w.steps.length} шагов · ${escapeHtml(w.description)}</small></div><button onclick="runWorkflow('${w.id}')">Запустить</button></div>`).join('') : '<div class="empty">Workflow пока нет.</div>';
  $('runs').innerHTML = runs.length ? runs.map(r => `<div class="row"><div><div class="name"><code>${r.id.slice(0,8)}</code> · шаг ${r.current_step}</div><small>${r.error ? escapeHtml(r.error) : r.created_at}</small></div><span class="status ${r.status}">${statusLabel(r.status)}</span></div>`).join('') : '<div class="empty">Запусков пока нет.</div>';
}
async function runWorkflow(id) { await api(`/api/workflows/${id}/runs`, {method:'POST'}); await refresh(); }
$('workflow-form').addEventListener('submit', async event => { event.preventDefault(); try { const steps = JSON.parse($('steps').value); await api('/api/workflows', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({name:$('name').value, description:$('description').value, steps})}); $('form-message').textContent='Workflow создан'; await refresh(); } catch (error) { $('form-message').textContent='Ошибка: ' + error.message; } });
function statusLabel(status) { return ({PENDING:'Ожидает', RUNNING:'Выполняется', COMPLETED:'Завершён', FAILED:'Ошибка'})[status] || status; }
function escapeHtml(value) { return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
refresh(); setInterval(refresh, 1500);
</script></body></html>
