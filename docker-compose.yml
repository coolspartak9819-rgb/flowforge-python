services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
    volumes:
      - flowforge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@db:5432/flowforge
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://flowforge:flowforge@db:5432/flowforge
      REDIS_URL: redis://redis:6379/0
      WORKER_NAME: worker-1
      WORKER_RECOVERY_IDLE_MS: 30000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  flowforge-db:
